name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hop-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hop-aarch64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: hop-x86_64-apple-darwin
          # macOS hosts build both Apple slices natively (x86_64 cross-compiles
          # on the arm64 runner), so no macos-13 dependency.
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hop-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable

      - name: install target
        run: rustup target add ${{ matrix.target }}

      - name: install aarch64 linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: rename
        run: cp target/${{ matrix.target }}/release/hop "${{ matrix.artifact }}"

      - name: upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
